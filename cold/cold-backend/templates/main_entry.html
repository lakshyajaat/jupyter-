<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Entry - Cold Storage Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Cold Storage Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="/main-entry">Main Entry</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/room-entry">Room Entry</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/item-locations">Item Locations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/entries">All Entries</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">New Item Entry</h5>
                    </div>
                    <div class="card-body">
                        <form id="itemForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <div class="input-group">
                                        <input type="tel" class="form-control" id="phone" required pattern="[0-9]{10}">
                                        <button type="button" class="btn btn-outline-secondary" id="searchPhone">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="village" class="form-label">Village</label>
                                    <input type="text" class="form-control" id="village" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="itemType" class="form-label">Item Type</label>
                                    <select class="form-select" id="itemType" required>
                                        <option value="">Select Item Type</option>
                                        <option value="vegetables">Vegetables</option>
                                        <option value="fruits">Fruits</option>
                                        <option value="dairy">Dairy</option>
                                        <option value="meat">Meat</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="expectedQty" class="form-label">Expected Quantity (kg)</label>
                                    <input type="number" step="0.01" class="form-control" id="expectedQty" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="temperature" class="form-label">Required Temperature (°C)</label>
                                    <input type="number" step="0.1" class="form-control" id="temperature" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label for="jgdNumber" class="form-label">JGD Number</label>
                                    <input type="text" class="form-control" id="jgdNumber" readonly>
                                </div>
                                <div class="col-md-4">
                                    <label for="invoiceNumber" class="form-label">Invoice Number</label>
                                    <input type="text" class="form-control" id="invoiceNumber">
                                </div>
                                <div class="col-md-4">
                                    <label for="thokNumber" class="form-label">Thok Number</label>
                                    <input type="text" class="form-control" id="thokNumber">
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <button type="button" class="btn btn-secondary" id="generateJGD">Generate JGD</button>
                                <button type="submit" class="btn btn-primary">Submit Entry</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Recent Entries</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>JGD</th>
                                        <th>Type</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="recentEntriesTable">
                                    <!-- Recent entries will be dynamically added here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Entry Created Successfully</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>The entry has been created successfully.</p>
                    <p>JGD Number: <strong id="modalJGD"></strong></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="newEntry">New Entry</button>
                    <button type="button" class="btn btn-primary" id="printEntry">Print Entry</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main_entry.js"></script>
</body>
</html>
