<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Storage Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #e5dede;
        }
        .neu-brutal {
            background: rgb(255, 255, 255);
            border: 3px solid black;
            box-shadow: 5px 5px 0px black;
            transition: all 0.2s ease;
        }
        .neu-brutal:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px black;
        }
        .nav-button {
            background: #ffaf6d;
        }
        input, button {
            outline: none !important;
        }
    </style>
</head>
<body class="p-4">
    <nav class="neu-brutal mb-8 p-4 flex flex-wrap justify-between items-center">
        <h1 class="text-2xl font-bold">Cold Storage Management</h1>
        <div class="flex gap-4">
            <button class="neu-brutal nav-button px-4 py-2">dashboard</button>
        </div>
    </nav>

    <main class="neu-brutal p-8 max-w-4xl mx-auto">
        <h2 class="text-3xl font-bold mb-8">Main Entry Form</h2>
        <form id="entryForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block mb-2 font-bold">Phone Number</label>
                    <div class="flex gap-2">
                        <input type="tel" pattern="[0-9]{10}" class="neu-brutal w-full p-2" placeholder="10 digit no." required>
                        <button type="button" class="neu-brutal px-6 py-2 bg-green-200">search</button>
                    </div>
                </div>
                <div>
                    <label class="block mb-2 font-bold">Item Type</label>
                    <select class="w-full p-2 neu-brutal" required>
                        <option value="">Select type</option>
                        <option value="1">seed</option>
                        <option value="2">seel</option>                        
                    </select>
                </div>
                <div>
                    <label class="block mb-2 font-bold">Expected Quantity</label>
                    <input type="number" class="neu-brutal w-full p-2" required>
                </div>
                <div>
                    <label class="block mb-2 font-bold">Thok Number</label>
                    <input type="text" class="neu-brutal w-full p-2" required>
                </div>
            </div>
            <div class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block mb-2 font-bold">Name</label>
                        <input type="text" class="neu-brutal w-full p-2" required>
                    </div>
                    <div>
                        <label class="block mb-2 font-bold">Village</label>
                        <input type="text" class="neu-brutal w-full p-2" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="neu-brutal px-8 py-3 bg-yellow-200 font-bold">Save Entry</button>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="neu-brutal bg-white p-6">
            <h3 class="text-xl font-bold mb-4">Recent Room Entries</h3>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="table-header">
                        <tr>
                            <th class="p-2 text-left">Thock Number</th>
                            <th class="p-2 text-left">Location</th>
                            <th class="p-2 text-left">Gatar Numbers</th>
                            <th class="p-2 text-left">Quantity</th>
                            <th class="p-2 text-left">Remarks</th>
                            <th class="p-2 text-left">Time</th>
                        </tr>
                    </thead>
                    <tbody id="roomEntriesTable"></tbody>
                </table>
            </div>
        </div>

        <div class="neu-brutal bg-white p-6">
            <h3 class="text-xl font-bold mb-4">Recent Main Entries</h3>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="table-header">
                        <tr>
                            <th class="p-2 text-left">Thock Number</th>
                            <th class="p-2 text-left">Name</th>
                            <th class="p-2 text-left">Village</th>
                            <th class="p-2 text-left">Quantity</th>
                            <th class="p-2 text-left">Action</th>
                        </tr>
                    </thead>
                    <tbody id="mainEntriesTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    
        </form>
    </main>

    <script>
        // Form submission handling
        document.getElementById('roomEntryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form data and add to the recent entries table
            const now = new Date();
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td class="p-2">Thock{Math.floor(Math.random() * 1000)}</td>
                <td class="p-2">Room ${document.querySelector('select').value}</td>
                <td class="p-2">${document.querySelector('input[type="text"]').value}</td>
                <td class="p-2">${document.querySelector('input[type="number"]').value}</td>
                <td class="p-2">${document.querySelector('textarea').value}</td>
                <td class="p-2">${now.toLocaleTimeString()}</td>
            `;
            document.getElementById('roomEntriesTable').prepend(newRow);
            
            // Reset form
            this.reset();
        });

        // Sample data for main entries
        const sampleMainEntries = [
            { Thock: '200/45', name: 'John Doe', village: 'Village A', quantity: 100 },
            { Thock: '1/23', name: 'Jane Smith', village: 'Village B', quantity: 150 }
        ];

        // Populate main entries table
        sampleMainEntries.forEach(entry => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="p-2">${entry.Thock}</td>
                <td class="p-2">${entry.name}</td>
                <td class="p-2">${entry.village}</td>
                <td class="p-2">${entry.quantity}</td>
                <td class="p-2">
                    <button class="neu-button px-2 py-1">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="neu-button px-2 py-1 bg-red-400">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            document.getElementById('mainEntriesTable').appendChild(row);
        });
    </script>

</body>
</html>
