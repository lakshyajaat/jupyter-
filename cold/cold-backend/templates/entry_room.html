<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry Room - Cold Storage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Space Grotesk', sans-serif;
        }
        .neu-border {
            border: 3px solid #000;
            box-shadow: 4px 4px 0 #000;
            transition: all 0.2s ease;
        }
        .neu-border:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }
        .neu-input {
            border: 3px solid #000;
            box-shadow: 4px 4px 0 #000;
            padding: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .neu-input:focus {
            outline: none;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }
        .neu-button {
            border: 3px solid #000;
            box-shadow: 4px 4px 0 #000;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .neu-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }
        .neu-button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-[#FFF9E6] min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 neu-border bg-white p-6">
            <div>
                <div class="flex items-center gap-3">
                    <i class="bi bi-box-arrow-in-right text-4xl text-orange-600"></i>
                    <div>
                        <h1 class="text-3xl font-bold">Entry Room</h1>
                        <p class="text-gray-600">Register new entry</p>
                    </div>
                </div>
            </div>
            <button onclick="goBack()" class="neu-button bg-gray-200">
                <i class="bi bi-arrow-left"></i> Back
            </button>
        </header>

        <!-- User Details & Entry Form -->
        <div id="entryForm" class="neu-border bg-white p-6">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                <i class="bi bi-person-check"></i>
                User Details & Entry
            </h2>

            <div class="grid grid-cols-2 gap-6 mb-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Name *
                    </label>
                    <input
                        type="text"
                        id="userName"
                        required
                        class="w-full neu-input"
                        placeholder="Enter name"
                    >
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Village *
                    </label>
                    <input
                        type="text"
                        id="userVillage"
                        required
                        class="w-full neu-input"
                        placeholder="Enter village"
                    >
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Phone * <span class="text-sm text-gray-500">(Search to auto-fill)</span>
                    </label>
                    <div class="flex gap-2">
                        <input
                            type="tel"
                            id="userPhone"
                            required
                            class="flex-1 neu-input"
                            placeholder="Enter phone"
                            maxlength="15"
                        >
                        <button type="button" onclick="searchUser()" class="neu-button bg-blue-500 text-white">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                    <div id="searchError" class="hidden mt-2 p-2 bg-red-100 border-2 border-red-600">
                        <p class="text-red-700 text-sm font-semibold"></p>
                    </div>
                    <div id="searchSuccess" class="hidden mt-2 p-2 bg-green-100 border-2 border-green-600">
                        <p class="text-green-700 text-sm font-semibold">Customer found! Details auto-filled.</p>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Email
                    </label>
                    <input
                        type="email"
                        id="userEmail"
                        class="w-full neu-input"
                        placeholder="Enter email (optional)"
                    >
                </div>
            </div>

            <form id="entrySubmitForm" onsubmit="submitEntry(event)">
                <input type="hidden" id="userId" />

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Select Category *
                    </label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="neu-border p-4 bg-green-50 cursor-pointer hover:bg-green-100 transition-colors">
                            <input
                                type="radio"
                                name="truckCategory"
                                value="seed"
                                required
                                class="mr-2"
                            >
                            <span class="text-xl font-bold text-green-700">SEED</span>
                        </label>
                        <label class="neu-border p-4 bg-orange-50 cursor-pointer hover:bg-orange-100 transition-colors">
                            <input
                                type="radio"
                                name="truckCategory"
                                value="sell"
                                required
                                class="mr-2"
                            >
                            <span class="text-xl font-bold text-orange-700">SELL</span>
                        </label>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Expected Quantity *
                    </label>
                    <input
                        type="number"
                        id="expectedQuantity"
                        required
                        min="1"
                        class="w-full neu-input"
                        placeholder="Enter quantity"
                    >
                </div>

                <div class="mb-6 p-4 bg-blue-50 neu-border">
                    <p class="text-sm text-gray-600">
                        <i class="bi bi-info-circle"></i>
                        Truck number will be auto-generated as: <strong>CATEGORY-XXX/QUANTITY</strong>
                    </p>
                </div>

                <div class="flex gap-4">
                    <button type="submit" class="neu-button bg-green-500 text-white flex-1">
                        <i class="bi bi-check-circle"></i> Submit Entry
                    </button>
                    <button type="button" onclick="resetForm()" class="neu-button bg-gray-300">
                        <i class="bi bi-x-circle"></i> Reset
                    </button>
                </div>
            </form>
        </div>

        <!-- Success Message -->
        <div id="successMessage" class="hidden mt-6 neu-border bg-green-100 p-6">
            <h3 class="text-xl font-bold text-green-700 mb-2 flex items-center gap-2">
                <i class="bi bi-check-circle-fill"></i>
                Entry Created Successfully!
            </h3>
            <p class="text-green-700">Truck Number: <span id="assignedTruck" class="font-bold"></span></p>
            <button onclick="resetForm()" class="mt-4 neu-button bg-green-500 text-white">
                Create Another Entry
            </button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        let currentUser = null;


        async function searchUser() {
            const phone = document.getElementById('userPhone').value.trim();
            const errorEl = document.getElementById('searchError');
            const successEl = document.getElementById('searchSuccess');

            if (!phone) {
                showError('Please enter a phone number');
                return;
            }

            try {
                const response = await fetch(`/api/customers/search?phone=${phone}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    throw new Error('Customer not found - you can still create a new entry');
                }

                currentUser = await response.json();
                displayUserDetails(currentUser);
                errorEl.classList.add('hidden');
                successEl.classList.remove('hidden');
            } catch (error) {
                showError(error.message);
                successEl.classList.add('hidden');
            }
        }

        function displayUserDetails(user) {
            document.getElementById('userName').value = user.name || '';
            document.getElementById('userVillage').value = user.village || '';
            document.getElementById('userEmail').value = user.email || '';
            document.getElementById('userId').value = user.id;
        }

        async function submitEntry(event) {
            event.preventDefault();

            const quantity = parseInt(document.getElementById('expectedQuantity').value);

            // Validate quantity
            if (quantity < 1) {
                alert('Quantity must be at least 1');
                return;
            }

            // Get values from input fields
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const village = document.getElementById('userVillage').value.trim();
            const email = document.getElementById('userEmail').value.trim();

            // Validate required fields
            if (!name || !phone || !village) {
                alert('Please fill in all required fields (Name, Phone, Village)');
                return;
            }

            // Get selected category from radio buttons
            const categoryRadio = document.querySelector('input[name="truckCategory"]:checked');
            if (!categoryRadio) {
                alert('Please select a category (SEED or SELL)');
                return;
            }
            const category = categoryRadio.value;

            const entryData = {
                customer_id: parseInt(document.getElementById('userId').value) || 0,
                phone: phone,
                name: name,
                village: village,
                expected_quantity: quantity,
                truck_category: category
            };

            try {
                const response = await fetch('/api/entries', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(entryData)
                });

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error);
                }

                const result = await response.json();
                showSuccess(result.truck_number || 'AUTO-' + result.id);
            } catch (error) {
                alert('Error creating entry: ' + error.message);
            }
        }

        function showError(message) {
            const errorEl = document.getElementById('searchError');
            errorEl.querySelector('p').textContent = message;
            errorEl.classList.remove('hidden');
        }

        function showSuccess(truckNumber) {
            document.getElementById('assignedTruck').textContent = truckNumber;
            document.getElementById('successMessage').classList.remove('hidden');
            // Scroll to success message
            document.getElementById('successMessage').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetForm() {
            document.getElementById('userName').value = '';
            document.getElementById('userVillage').value = '';
            document.getElementById('userPhone').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('entrySubmitForm').reset();
            document.getElementById('successMessage').classList.add('hidden');
            document.getElementById('searchError').classList.add('hidden');
            document.getElementById('searchSuccess').classList.add('hidden');

            // Uncheck all radio buttons
            const radios = document.querySelectorAll('input[name="truckCategory"]');
            radios.forEach(radio => radio.checked = false);

            currentUser = null;
        }

        function goBack() {
            window.history.back();
        }
    </script>
    
</body>
</html>
