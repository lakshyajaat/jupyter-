<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guru Kripa Coldstore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f0f0f0;
        }
        .neu-brutal {
            background: white;
            border: 3px solid black;
            box-shadow: 5px 5px 0px black;
            transition: all 0.2s ease;
        }
        .neu-brutal:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px black;
        }
        input, select {
            border: 2px solid black !important;
            background: white !important;
        }
        button {
            transition: all 0.2s ease;
        }
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px black !important;
        }
        @media print {
            .no-print {
                display: none;
            }
            .neu-brutal {
                box-shadow: none !important;
                border: 1px solid black !important;
            }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto neu-brutal p-6 md:p-8">
        <h1 class="text-3xl font-bold text-center mb-8">Guru Kripa Coldstore</h1>
        
        <form id="coldstoreForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-bold mb-1">Thock No.:</label>
                    <input type="text" class="w-full p-2 neu-brutal" required>
                </div>
                <div>
                    <label class="block font-bold mb-1">Item Type:</label>
                    <input type="text" class="w-full p-2 neu-brutal" required>
                </div>
                <div>
                    <label class="block font-bold mb-1">Invoice Number:</label>
                    <input type="text" class="w-full p-2 neu-brutal" required>
                </div>
                <div>
                    <label class="block font-bold mb-1">Expected Quantity:</label>
                    <input type="number" class="w-full p-2 neu-brutal" required>
                </div>
                <div>
                    <label class="block font-bold mb-1">Quantity in Room:</label>
                    <input type="number" class="w-full p-2 neu-brutal" required>
                </div>
                <div>
                    <label class="block font-bold mb-1">Room Number:</label>
                    <input type="text" class="w-full p-2 neu-brutal" required>
                </div>
                <div>
                    <label class="block font-bold mb-1">Floor Number:</label>
                    <input type="text" class="w-full p-2 neu-brutal" required>
                </div>
                <div>
                    <label class="block font-bold mb-1">Remarks:</label>
                    <input type="text" class="w-full p-2 neu-brutal">
                </div>
                <div>
                    <label class="block font-bold mb-1">Toilet Payment:</label>
                    <input type="number" class="w-full p-2 neu-brutal">
                </div>
            </div>

            <div class="mt-4 text-right">
                <p class="font-bold">Date and Time: <span id="datetime"></span></p>
            </div>

            <div class="flex justify-center mt-6 space-x-4">
                <button type="button" onclick="printForm()" class="neu-brutal bg-yellow-300 px-8 py-2 font-bold no-print">
                    <i class="bi bi-printer"></i> Print
                </button>
                <button type="reset" class="neu-brutal bg-red-300 px-8 py-2 font-bold no-print">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </button>
            </div>
        </form>
    </div>

    <script>
        // Update date and time
        function updateDateTime() {
            const now = new Date();
            document.getElementById('datetime').textContent = now.toLocaleString();
        }
        
        // Update initially and every second
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // Print functionality
        function printForm() {
            // Validate form
            const form = document.getElementById('coldstoreForm');
            if (!form.checkValidity()) {
                alert('Please fill in all required fields');
                return;
            }
            
            window.print();
        }
    </script>
</body>
</html>
